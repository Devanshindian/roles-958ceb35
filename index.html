<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anirudh's Roles</title>
<meta name="description" content="Startups and roles Anirudh is going after.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f1a;
    --bg-2: #141829;
    --card: #181c30;
    --line: #2a3050;
    --text: #eef0fa;
    --muted: #9aa1c2;
    --accent: #ffcf3f;
    --accent-2: #ff5d8f;
    --accent-3: #4fd1c5;
    --sky-1: #1b2145;
    --sky-2: #0d0f1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: "Bricolage Grotesque", Inter, sans-serif; }

  /* ---------- hero / race ---------- */
  .hero {
    position: relative;
    background: radial-gradient(1200px 400px at 50% -10%, #2b3470 0%, var(--sky-1) 40%, var(--sky-2) 100%);
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .hero-inner { max-width: 1100px; margin: 0 auto; padding: 28px 16px 0; }
  .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .title-row h1 { font-size: clamp(28px, 5vw, 46px); font-weight: 800; letter-spacing: -0.02em; }
  .title-row h1 span { color: var(--accent); }
  .tag { color: var(--muted); font-size: 14px; }
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .stars i {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #fff; opacity: .5; animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle { 50% { opacity: .1; } }

  .stage {
    position: relative;
    height: 250px;
    margin-top: 8px;
  }
  .ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 58px;
    background: linear-gradient(#1f2547, #161a33);
    border-top: 2px solid #3a4275;
  }
  .numberline {
    position: absolute; left: 4%; right: 6%; bottom: 46px; height: 2px;
    background: #6b74b0;
  }
  .tick {
    position: absolute; bottom: 30px; width: 2px; height: 14px; background: #6b74b0;
    transform: translateX(-1px);
  }
  .tick b {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    font: 600 11px Inter, sans-serif; color: var(--muted);
  }
  .finish {
    position: absolute; bottom: 30px; width: 14px; height: 120px;
    transform: translateX(-7px);
  }
  .finish .pole { position: absolute; left: 6px; bottom: 0; width: 3px; height: 120px; background: #ddd; border-radius: 2px; }
  .finish .flag {
    position: absolute; left: 9px; top: 0; width: 46px; height: 30px;
    background:
      conic-gradient(#000 25%, #fff 0 50%, #000 0 75%, #fff 0) 0 0 / 15px 15px;
    border: 1px solid #fff; transform-origin: left center;
    animation: wave 1s ease-in-out infinite;
  }
  @keyframes wave { 50% { transform: skewY(-6deg) scaleX(.94); } }
  .finish small {
    position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
    font: 700 11px Inter; color: var(--accent); white-space: nowrap;
  }

  /* runner */
  .runner {
    position: absolute; bottom: 47px; left: 0;
    width: 70px; height: 112px;
    will-change: transform;
  }
  .runner .bob { position: absolute; inset: 0; animation: bob .36s ease-in-out infinite; }
  .runner.stop .bob, .runner.stop .leg, .runner.stop .arm-l { animation-play-state: paused; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .runner .face {
    position: absolute; top: 0; left: 6px; width: 58px; height: 58px;
    border-radius: 12px; border: 3px solid #fff;
    background: url("anirudh.jpg") center / cover;
    box-shadow: 0 6px 16px rgba(0,0,0,.45);
    z-index: 3;
  }
  .runner .leg {
    position: absolute; top: 56px; width: 8px; height: 40px;
    background: #3b4cc0; border-radius: 4px;
    transform-origin: top center; z-index: 1;
  }
  .runner .leg::after {
    content: ""; position: absolute; bottom: -6px; left: -2px;
    width: 20px; height: 9px; border-radius: 6px 9px 4px 4px;
    background: var(--accent-2);
  }
  .runner .leg.l { left: 24px; animation: legA .36s linear infinite; }
  .runner .leg.r { left: 38px; animation: legB .36s linear infinite; }
  @keyframes legA { 0%,100% { transform: rotate(35deg); } 50% { transform: rotate(-35deg); } }
  @keyframes legB { 0%,100% { transform: rotate(-35deg); } 50% { transform: rotate(35deg); } }
  .runner .arm-l {
    position: absolute; top: 50px; left: 2px; width: 7px; height: 28px;
    background: #3b4cc0; border-radius: 4px; transform-origin: top center;
    animation: legB .36s linear infinite; z-index: 2;
  }
  .runner .sword-arm {
    position: absolute; top: 50px; left: 58px; width: 7px; height: 26px;
    background: #3b4cc0; border-radius: 4px;
    transform-origin: top center; transform: rotate(-120deg);
    transition: transform .12s ease-in; z-index: 4;
  }
  .runner .sword {
    position: absolute; bottom: -54px; left: -3px; width: 13px; height: 60px;
  }
  .runner .sword .blade {
    position: absolute; left: 4px; top: 12px; width: 6px; height: 48px;
    background: linear-gradient(90deg, #e9eefc, #9fb0d8);
    clip-path: polygon(0 0, 100% 0, 100% 88%, 50% 100%, 0 88%);
  }
  .runner .sword .guard { position: absolute; left: -3px; top: 8px; width: 19px; height: 5px; background: var(--accent); border-radius: 3px; }
  .runner .sword .grip { position: absolute; left: 4px; top: 0; width: 6px; height: 9px; background: #7a4b22; border-radius: 2px; }
  .runner.slash .sword-arm { transform: rotate(-20deg); transition-duration: .09s; }
  .slash-trail {
    position: absolute; top: 20px; left: 50px; width: 70px; height: 70px;
    border-radius: 50%; border-top: 4px solid rgba(255,255,255,.85);
    border-right: 4px solid rgba(255,255,255,.4);
    transform: rotate(-30deg) scale(.6); opacity: 0; pointer-events: none;
  }
  .runner.slash .slash-trail { animation: trail .25s ease-out; }
  @keyframes trail { 0% { opacity: 1; transform: rotate(-60deg) scale(.6); } 100% { opacity: 0; transform: rotate(40deg) scale(1.1); } }
  .dust {
    position: absolute; bottom: 44px; width: 10px; height: 10px; border-radius: 50%;
    background: rgba(200,210,255,.35); pointer-events: none;
    animation: dust .6s ease-out forwards;
  }
  @keyframes dust { to { transform: translate(-24px, -10px) scale(2.2); opacity: 0; } }

  /* bubbles */
  .bubble {
    position: absolute; bottom: 92px;
    width: 92px; height: 92px; border-radius: 50%;
    transform: translateX(-50%);
    display: grid; place-items: center; text-align: center;
    padding: 10px;
    font: 700 13px/1.15 "Bricolage Grotesque", Inter, sans-serif;
    color: #fff;
    background:
      radial-gradient(circle at 30% 28%, rgba(255,255,255,.75) 0 7%, transparent 9%),
      radial-gradient(circle at 50% 50%, rgba(79,209,197,.15), rgba(79,209,197,.45) 70%, rgba(255,255,255,.6) 100%);
    border: 2px solid rgba(255,255,255,.55);
    box-shadow: inset 0 0 18px rgba(255,255,255,.25), 0 0 24px rgba(79,209,197,.25);
    animation: float 2.4s ease-in-out infinite;
    transition: opacity .2s, transform .2s;
  }
  .bubble:nth-child(even) { animation-delay: -1.2s; }
  @keyframes float { 50% { margin-bottom: 12px; } }
  .bubble.popped { opacity: 0; transform: translateX(-50%) scale(1.5); }
  .particle {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    pointer-events: none; animation: burst .6s ease-out forwards;
  }
  @keyframes burst { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  .cracked {
    position: absolute; bottom: 150px; transform: translateX(-50%);
    font: 800 22px "Bricolage Grotesque", sans-serif; color: var(--accent);
    text-shadow: 0 3px 0 #b3361f, 0 0 18px rgba(255,207,63,.6);
    pointer-events: none; white-space: nowrap;
    animation: cracked 1.1s ease-out forwards;
  }
  .cracked small { display: block; font-size: 12px; color: #fff; text-shadow: none; text-align: center; }
  @keyframes cracked {
    0% { opacity: 0; transform: translateX(-50%) scale(.4) rotate(-8deg); }
    20% { opacity: 1; transform: translateX(-50%) scale(1.15) rotate(3deg); }
    100% { opacity: 0; transform: translate(-50%, -40px) scale(1); }
  }
  .hurray {
    position: absolute; left: 50%; top: 34%;
    transform: translate(-50%, -50%) scale(.5);
    font: 800 clamp(26px, 5vw, 44px) "Bricolage Grotesque", sans-serif;
    color: var(--accent); text-align: center; white-space: nowrap;
    text-shadow: 0 4px 0 #b3361f, 0 0 30px rgba(255,207,63,.5);
    opacity: 0; pointer-events: none; transition: opacity .3s, transform .4s cubic-bezier(.3,1.6,.5,1);
  }
  .hurray.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .confetti {
    position: absolute; top: -12px; width: 8px; height: 14px; pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translate(var(--dx), 300px) rotate(720deg); opacity: .2; } }
  .score {
    position: absolute; right: 16px; top: 10px;
    font: 700 13px Inter; color: var(--muted);
    background: rgba(0,0,0,.25); border: 1px solid var(--line);
    padding: 4px 10px; border-radius: 999px;
  }
  .score b { color: var(--accent); }

  /* ---------- roles ---------- */
  main { max-width: 1100px; margin: 0 auto; padding: 36px 16px 64px; }
  .section-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .section-head h2 { font-size: 26px; font-weight: 800; }
  .section-head p { color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; display: flex; flex-direction: column; gap: 14px;
    transition: transform .2s, border-color .2s;
  }
  .card:hover { transform: translateY(-3px); border-color: #4a5390; }
  .card-top { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
  .num {
    font: 800 13px "Bricolage Grotesque"; color: var(--bg);
    background: var(--accent); border-radius: 8px; padding: 2px 8px; flex: none;
  }
  .card h3 { font-size: 24px; font-weight: 800; line-height: 1.1; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .role {
    display: inline-block; font-size: 13px; font-weight: 600;
    color: var(--accent-3); background: rgba(79,209,197,.1);
    border: 1px solid rgba(79,209,197,.35); border-radius: 999px; padding: 3px 10px;
  }
  .what { color: #d5d9ee; font-size: 15px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .meta span { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  .founders h4 { font: 600 12px Inter; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
  .founder { padding: 10px 0; border-top: 1px dashed var(--line); }
  .founder:first-of-type { border-top: 0; padding-top: 0; }
  .founder .name { font-weight: 600; font-size: 15px; }
  .founder .name a { color: var(--text); text-decoration: none; border-bottom: 1px solid #4a5390; }
  .founder .name a:hover { color: var(--accent); border-color: var(--accent); }
  .founder .title { color: var(--muted); font-size: 13px; }
  .founder ul { list-style: none; margin-top: 4px; }
  .founder li { font-size: 14px; color: #cdd2ea; padding-left: 16px; position: relative; }
  .founder li::before { content: "▸"; position: absolute; left: 0; color: var(--accent-2); }
  .contact { font-size: 13px; color: var(--muted); }
  .contact a { color: var(--accent); }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 32px; }

  @media (max-width: 640px) {
    .stage { height: 220px; }
    .bubble { width: 70px; height: 70px; font-size: 11px; bottom: 96px; }
    .runner { transform-origin: bottom left; }
    .grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .runner .bob, .runner .leg, .runner .arm-l, .bubble, .finish .flag, .stars i { animation: none !important; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="stars" id="stars"></div>
  <div class="hero-inner">
    <div class="title-row">
      <h1>Anirudh is <span>cracking</span> these.</h1>
      <p class="tag">Roles worth going after, picked one by one.</p>
    </div>
    <div class="stage" id="stage">
      <div class="score" id="score">cracked <b>0</b> / 0</div>
      <div class="ground"></div>
      <div class="numberline" id="numberline"></div>
      <div class="hurray" id="hurray">Hip hip hurray! 🎉</div>
      <div class="runner" id="runner" aria-label="Anirudh running">
        <div class="bob">
          <div class="leg l"></div>
          <div class="leg r"></div>
          <div class="arm-l"></div>
          <div class="face"></div>
          <div class="sword-arm">
            <div class="sword"><div class="grip"></div><div class="guard"></div><div class="blade"></div></div>
          </div>
          <div class="slash-trail"></div>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="section-head">
    <h2>The list</h2>
    <p id="count"></p>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>Updated <span id="updated"></span></footer>

<script>
/* ============================================================
   THE LIST. To add a company, copy one block and fill it in.
   Everything on the page (bubbles + cards) is built from this.
   ============================================================ */
const UPDATED = "3 Oct 2026";
const ROLES = [
  {
    company: "HomeRun",
    url: "https://home-run.co",
    role: "Ops / Category, open application",
    what: "Blinkit for construction material. Contractors order cement, plywood, wires and paint and get them in 60–90 minutes from HomeRun's own dark stores.",
    meta: ["Bengaluru", "$12M Series A+, Nexus (Aug 2026)", "100K+ orders, Hyderabad & Pune next"],
    founders: [
      {
        name: "Pukhraj Grewal", title: "Founder & CEO",
        linkedin: "https://in.linkedin.com/in/pukhrajgrewal",
        points: ["IIT Roorkee", "Second-time founder in construction: Project Hero (labour hiring) and Tornado (interiors)", "Ran a contracting business for ~5 years"]
      }
    ],
    contact: "hiring@home-run.co"
  },
  {
    company: "Gravity",
    url: "https://inc42.com/buzz/ex-livspace-cofounder-cbo-launch-home-interior-materials-venture-gravity/",
    role: "Founder's Office, no posting yet",
    what: "A full-stack operating platform for premium interior materials. Brings specialist kitchen and wardrobe businesses onto one shared tech, distribution and supply backbone for designers and studios.",
    meta: ["Bengaluru", "$15M, 3one4 Capital + Info Edge (Sep 2026)", "EBITDA positive from day one"],
    founders: [
      {
        name: "Saurabh Jain", title: "Co-founder",
        points: ["IIT Delhi, ISB", "Co-founder & India CEO of Livspace, scaled it to ~₹1,500 Cr run rate", "Sold his first startup, DezignUp, to Livspace"]
      },
      {
        name: "Lalit Mittal", title: "Co-founder",
        points: ["IIT Delhi", "Livspace CBO India, led the 30-city expansion", "Ex-Meesho; co-founded Labstreet (acquired)"]
      }
    ],
    contact: "No public email. LinkedIn the founders."
  },
  {
    company: "Indecimal",
    url: "https://www.indecimal.com",
    role: "Founder's Office, Growth (18–20 LPA)",
    what: "Builds homes end to end in Bengaluru with tech: fixed pricing, tracked progress, no contractor runaround. The role exists to take them to a second city.",
    meta: ["Bengaluru", "Founded Jun 2025", "~85 projects delivered"],
    founders: [
      {
        name: "Abhijit Sarkar", title: "Co-founder & CEO",
        points: ["B.Tech, MBA from JAGSoM", "Ex-Nestaway, Puravankara, makeO"]
      },
      {
        name: "Utkarsh Mishra", title: "Co-founder, Growth & Product",
        linkedin: "https://www.linkedin.com/in/utkarsh-mishra--/",
        points: ["BIT Mesra", "Ran the E-Cell there, 150+ members", "Says he hires for judgment, not skill"]
      },
      {
        name: "Pushker Prakash", title: "Co-founder & Tech Lead",
        points: ["BIT Mesra", "Ex-TenderFix, TrueGradient"]
      }
    ],
    contact: "LinkedIn Utkarsh, he owns the role."
  }
];

/* ---------- cards ---------- */
const grid = document.getElementById("grid");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
grid.innerHTML = ROLES.map((r, i) => `
  <article class="card">
    <div class="card-top">
      <div>
        <h3><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.company)}</a></h3>
      </div>
      <span class="num">#${i + 1}</span>
    </div>
    <span class="role">${esc(r.role)}</span>
    <p class="what">${esc(r.what)}</p>
    <div class="meta">${r.meta.map(m => `<span>${esc(m)}</span>`).join("")}</div>
    <div class="founders">
      <h4>Founders</h4>
      ${r.founders.map(f => `
        <div class="founder">
          <div class="name">${f.linkedin ? `<a href="${esc(f.linkedin)}" target="_blank" rel="noopener">${esc(f.name)}</a>` : esc(f.name)}</div>
          <div class="title">${esc(f.title)}</div>
          <ul>${f.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
        </div>`).join("")}
    </div>
    ${r.contact ? `<p class="contact">${esc(r.contact)}</p>` : ""}
  </article>`).join("");
document.getElementById("count").textContent = `${ROLES.length} companies`;
document.getElementById("updated").textContent = UPDATED;

/* ---------- stars ---------- */
const stars = document.getElementById("stars");
for (let i = 0; i < 50; i++) {
  const s = document.createElement("i");
  s.style.left = Math.random() * 100 + "%";
  s.style.top = Math.random() * 60 + "%";
  s.style.animationDelay = (Math.random() * 3) + "s";
  stars.appendChild(s);
}

/* ---------- the race ---------- */
const stage = document.getElementById("stage");
const runner = document.getElementById("runner");
const hurray = document.getElementById("hurray");
const scoreEl = document.getElementById("score");
const START = 0.04, END = 0.94;           // number line from 4% to 94% of the stage
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

let W = stage.clientWidth;
let bubbles = [];
let finishEl;
let cracked = 0;

function build() {
  stage.querySelectorAll(".tick, .bubble, .finish").forEach(n => n.remove());
  W = stage.clientWidth;
  const n = ROLES.length;
  bubbles = ROLES.map((r, i) => {
    const frac = START + (END - START) * ((i + 1) / (n + 1));
    const x = frac * W;
    const tick = document.createElement("div");
    tick.className = "tick"; tick.style.left = x + "px";
    tick.innerHTML = `<b>${i + 1}</b>`;
    stage.appendChild(tick);
    const b = document.createElement("div");
    b.className = "bubble"; b.style.left = x + "px";
    b.textContent = r.company;
    stage.appendChild(b);
    return { el: b, x, name: r.company, popped: false };
  });
  const zero = document.createElement("div");
  zero.className = "tick"; zero.style.left = START * W + "px"; zero.innerHTML = "<b>0</b>";
  stage.appendChild(zero);
  finishEl = document.createElement("div");
  finishEl.className = "finish"; finishEl.style.left = END * W + "px";
  finishEl.innerHTML = `<div class="pole"></div><div class="flag"></div><small>FINISH</small>`;
  stage.appendChild(finishEl);
  updateScore();
}

function updateScore() {
  scoreEl.innerHTML = `cracked <b>${cracked}</b> / ${bubbles.length}`;
}

function pop(b) {
  b.popped = true;
  runner.classList.remove("slash"); void runner.offsetWidth; runner.classList.add("slash");
  setTimeout(() => {
    b.el.classList.add("popped");
    const bottom = parseFloat(getComputedStyle(b.el).bottom) + b.el.offsetHeight / 2;
    const colors = ["#ffcf3f", "#ff5d8f", "#4fd1c5", "#ffffff", "#8b9cff"];
    for (let i = 0; i < 14; i++) {
      const p = document.createElement("span");
      p.className = "particle";
      const a = (Math.PI * 2 * i) / 14;
      p.style.left = b.x + "px"; p.style.bottom = bottom + "px";
      p.style.background = colors[i % colors.length];
      p.style.setProperty("--dx", Math.cos(a) * 60 + "px");
      p.style.setProperty("--dy", -Math.sin(a) * 60 + "px");
      stage.appendChild(p);
      setTimeout(() => p.remove(), 650);
    }
    const c = document.createElement("div");
    c.className = "cracked"; c.style.left = b.x + "px";
    c.innerHTML = `CRACKED!<small>${esc(b.name)}</small>`;
    stage.appendChild(c);
    setTimeout(() => c.remove(), 1150);
    cracked++; updateScore();
  }, 90);
  setTimeout(() => runner.classList.remove("slash"), 320);
}

function celebrate() {
  hurray.classList.add("show");
  const colors = ["#ffcf3f", "#ff5d8f", "#4fd1c5", "#ffffff", "#8b9cff"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("span");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "%";
    c.style.background = colors[i % colors.length];
    c.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
    c.style.animationDuration = (1.4 + Math.random() * 1.4) + "s";
    c.style.animationDelay = (Math.random() * .5) + "s";
    stage.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

let x = 0, last = performance.now(), state = "run", waitUntil = 0, dustT = 0;
const RUNNER_W = 70;

function reset() {
  x = -RUNNER_W; cracked = 0;
  bubbles.forEach(b => { b.popped = false; b.el.classList.remove("popped"); });
  hurray.classList.remove("show");
  runner.classList.remove("stop");
  updateScore();
  state = "run";
}

function frame(now) {
  const dt = Math.min(50, now - last) / 1000; last = now;
  const speed = Math.max(110, W / 7);      // px per second, crosses the stage in ~7s
  if (state === "run") {
    x += speed * dt;
    const swordTip = x + RUNNER_W + 20;
    for (const b of bubbles) if (!b.popped && swordTip >= b.x - 10) pop(b);
    dustT += dt;
    if (dustT > .18) {
      dustT = 0;
      const d = document.createElement("span");
      d.className = "dust"; d.style.left = (x + 20) + "px";
      stage.appendChild(d); setTimeout(() => d.remove(), 620);
    }
    if (x + RUNNER_W + 6 >= END * W) {
      state = "party"; runner.classList.add("stop"); celebrate(); waitUntil = now + 2800;
    }
  } else if (state === "party" && now > waitUntil) {
    reset();
  }
  runner.style.transform = `translateX(${x}px)`;
  tick(frame);
}
// ?test drives the loop with timers so headless screenshots advance
const tick = location.search.includes("test") ? f => setTimeout(() => f(performance.now()), 16) : requestAnimationFrame.bind(window);

build();
if (reduced) {
  x = START * W; runner.style.transform = `translateX(${x}px)`; runner.classList.add("stop");
} else {
  x = -RUNNER_W; tick(frame);
}
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { build(); reset(); }, 150); });
</script>
</body>
</html>
