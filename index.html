<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anirudh's Roles</title>
<meta name="description" content="Startups and roles Anirudh is going after.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f6;
    --ink: #161616;
    --muted: #6f6e68;
    --faint: #a3a29b;
    --line: #dddbd4;
    --accent: #b3412a;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --sans: Inter, system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum", "cv11";
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  /* ---------- top ---------- */
  .top {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 22px 0 0; font-size: 12px; color: var(--muted);
    letter-spacing: .02em;
  }
  .top b { font-weight: 500; color: var(--ink); }
  .intro { padding: 44px 0 26px; }
  h1 {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(36px, 6vw, 52px); line-height: 1.05; letter-spacing: -0.01em;
  }
  h1 em { font-style: italic; }
  .intro p { margin-top: 10px; color: var(--muted); font-size: 15px; }

  /* ---------- the run ---------- */
  .stage {
    position: relative; height: 210px;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    overflow: hidden; user-select: none;
  }
  .score {
    position: absolute; right: 0; top: 12px;
    font-size: 12px; color: var(--muted); letter-spacing: .02em;
  }
  .line { position: absolute; left: 0; right: 0; bottom: 44px; height: 1px; background: var(--ink); opacity: .9; }
  .tick { position: absolute; bottom: 37px; width: 1px; height: 8px; background: var(--ink); }
  .tick b {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    font-weight: 400; font-size: 11px; color: var(--muted);
  }
  .finish { position: absolute; bottom: 44px; width: 1px; height: 70px; background: var(--ink); }
  .finish svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .finish small {
    position: absolute; top: 77px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: var(--muted); white-space: nowrap;
  }

  /* bubble = one company on the line */
  .bubble {
    position: absolute; bottom: 45px; width: 40px; height: 40px;
    border: 1px solid var(--ink); border-radius: 50%;
    transform: translateX(-50%);
    transition: opacity .22s ease-out, transform .22s ease-out;
  }
  .bubble.popped { opacity: 0; transform: translateX(-50%) scale(1.3); }
  .label {
    position: absolute; bottom: 95px; transform: translateX(-50%);
    font-size: 11px; color: var(--muted); white-space: nowrap;
    transition: opacity .2s;
  }
  .label.popped { opacity: 0; transition: none; }
  .burst {
    position: absolute; width: 1px; height: 10px; background: var(--ink);
    transform-origin: center; pointer-events: none;
    animation: burst .5s ease-out forwards;
  }
  @keyframes burst {
    from { transform: rotate(var(--a)) translateY(-18px); opacity: 1; }
    to   { transform: rotate(var(--a)) translateY(-44px) scaleY(.3); opacity: 0; }
  }
  .cracked {
    position: absolute; bottom: 134px; transform: translateX(-50%);
    white-space: nowrap; text-align: center; pointer-events: none;
    animation: cracked 1.1s ease-out forwards;
  }
  .cracked em { font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--accent); line-height: 1; }
  .cracked span { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  @keyframes cracked {
    0%   { opacity: 0; transform: translate(-50%, 6px); }
    12%  { opacity: 1; transform: translate(-50%, 0); }
    82%  { opacity: 1; transform: translate(-50%, -8px); }
    100% { opacity: 0; transform: translate(-50%, -16px); }
  }

  /* runner: photo + thin-line legs + sword, one SVG */
  .runner { position: absolute; left: 0; bottom: 44px; width: 44px; height: 72px; will-change: transform; }
  .runner svg { position: absolute; left: 0; bottom: 0; overflow: visible; }
  .runner .bob { animation: bob .36s ease-in-out infinite; }
  .runner.stop .bob, .runner.stop .leg { animation-play-state: paused; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  .leg { transform-box: view-box; transform-origin: var(--hx) 44px; }
  .leg.l { animation: legA .36s linear infinite; }
  .leg.r { animation: legB .36s linear infinite; }
  @keyframes legA { 0%,100% { transform: rotate(28deg); } 50% { transform: rotate(-28deg); } }
  @keyframes legB { 0%,100% { transform: rotate(-28deg); } 50% { transform: rotate(28deg); } }
  .arm { transform-box: view-box; transform-origin: 44px 24px; transform: rotate(-78deg); transition: transform .32s ease-out; }
  .runner.slash .arm { transform: rotate(12deg); transition: transform .09s ease-in; }
  .trail { opacity: 0; }
  .runner.slash .trail { animation: trail .3s ease-out; }
  @keyframes trail { 0% { opacity: .9; } 100% { opacity: 0; } }

  /* finish */
  .hurray {
    position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
    text-align: center; white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity .35s;
    z-index: 5; background: var(--bg, #faf9f6); padding: 4px 12px;
  }
  .hurray.show { opacity: 1; }
  .hurray em { font-family: var(--serif); font-style: italic; font-size: 30px; line-height: 1; }
  .confetti { position: absolute; left: 0; top: 0; width: 2px; height: 9px; pointer-events: none; will-change: transform; }

  /* ---------- the list ---------- */
  .list-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 40px 0 14px; font-size: 12px; color: var(--muted); letter-spacing: .02em;
  }
  ol.entries { list-style: none; border-top: 1px solid var(--line); }
  .entry {
    display: grid; grid-template-columns: 64px 1fr; column-gap: 16px;
    padding: 30px 0 34px; border-bottom: 1px solid var(--line);
  }
  .entry .n { font-size: 12px; color: var(--faint); padding-top: 12px; }
  .entry .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; }
  .entry h2 { font-family: var(--serif); font-weight: 400; font-size: 32px; line-height: 1.1; letter-spacing: -0.005em; }
  .entry h2 a { border-bottom: 1px solid transparent; }
  .entry h2 a:hover { border-bottom-color: var(--ink); }
  .entry .role { color: var(--muted); font-size: 14px; }
  .entry .what { margin-top: 10px; max-width: 58ch; }
  .entry .meta { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .entry .meta i { font-style: normal; color: var(--faint); padding: 0 6px; }
  .founders { margin-top: 20px; }
  .founders h3 { font-size: 11px; font-weight: 500; color: var(--faint); letter-spacing: .08em; text-transform: uppercase; }
  .founder { margin-top: 8px; font-size: 14px; line-height: 1.55; }
  .founder .who { color: var(--ink); }
  .founder .who a { border-bottom: 1px solid var(--line); }
  .founder .who a:hover { border-bottom-color: var(--ink); }
  .founder .who span { color: var(--muted); }
  .founder .pts { color: var(--muted); }
  .founder .pts i { font-style: normal; color: var(--faint); padding: 0 5px; }
  .contact { margin-top: 16px; font-size: 13px; color: var(--muted); }
  .contact a { color: var(--ink); border-bottom: 1px solid var(--line); }
  .contact a:hover { border-bottom-color: var(--ink); }
  footer { padding: 28px 0 48px; font-size: 12px; color: var(--muted); }

  @media (max-width: 640px) {
    body { font-size: 15px; }
    .intro { padding: 32px 0 22px; }
    .stage { height: 190px; }
    .label { bottom: 93px; }
    .cracked { bottom: 130px; }
    .entry { grid-template-columns: 1fr; row-gap: 6px; padding: 24px 0 28px; }
    .entry .n { padding-top: 0; }
    .entry h2 { font-size: 28px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .runner .bob, .runner .leg { animation: none !important; }
    .arm, .bubble, .label { transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <span><b>Anirudh</b> &middot; roles</span>
    <span>Updated <span id="updated"></span></span>
  </header>

  <section class="intro">
    <h1>Anirudh is <em>cracking</em> these.</h1>
    <p>Roles worth going after, picked one by one.</p>
  </section>

  <section class="stage" id="stage" aria-label="Anirudh runs the line and cracks each company">
    <div class="score" id="score"></div>
    <div class="line"></div>
    <div class="hurray" id="hurray"><em>Hip hip hurray</em></div>
    <div class="runner" id="runner" aria-hidden="true">
      <svg width="44" height="72" viewBox="0 0 44 72" fill="none" stroke="#161616" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
        <g class="bob">
          <image href="anirudh.jpg" x="0" y="0" width="44" height="44" preserveAspectRatio="xMidYMid slice"/>
          <rect x="0.5" y="0.5" width="43" height="43" />
          <g class="leg l" style="--hx:17px"><line x1="17" y1="44" x2="17" y2="70"/><line x1="17" y1="70" x2="25" y2="70"/></g>
          <g class="leg r" style="--hx:27px"><line x1="27" y1="44" x2="27" y2="70"/><line x1="27" y1="70" x2="35" y2="70"/></g>
          <path class="trail" d="M52 2 A 40 40 0 0 1 86 36" stroke-width="1" />
          <g class="arm">
            <line x1="44" y1="24" x2="58" y2="24"/>
            <line x1="60" y1="18" x2="60" y2="30"/>
            <line x1="60" y1="24" x2="88" y2="24" stroke-width="1.5"/>
          </g>
        </g>
      </svg>
    </div>
  </section>

  <main>
    <div class="list-head">
      <span>The list</span>
      <span id="count"></span>
    </div>
    <ol class="entries" id="entries"></ol>
  </main>

  <footer>Updated <span id="updated2"></span></footer>
</div>

<script>
/* ============================================================
   THE LIST. To add a company, copy one block and fill it in.
   Everything on the page (bubbles + entries) is built from this.
   ============================================================ */
const UPDATED = "3 Oct 2026";
const ROLES = [
  {
    company: "HomeRun",
    url: "https://home-run.co",
    role: "Ops / Category, open application",
    what: "Blinkit for construction material. Contractors order cement, plywood, wires and paint and get them in 60–90 minutes from HomeRun's own dark stores.",
    meta: ["Bengaluru", "$12M Series A+, Nexus (Aug 2026)", "100K+ orders, Hyderabad & Pune next"],
    founders: [
      {
        name: "Pukhraj Grewal", title: "Founder & CEO",
        linkedin: "https://in.linkedin.com/in/pukhrajgrewal",
        points: ["IIT Roorkee", "Second-time founder in construction: Project Hero (labour hiring) and Tornado (interiors)", "Ran a contracting business for ~5 years"]
      }
    ],
    contact: "hiring@home-run.co"
  },
  {
    company: "Gravity",
    url: "https://inc42.com/buzz/ex-livspace-cofounder-cbo-launch-home-interior-materials-venture-gravity/",
    role: "Founder's Office, no posting yet",
    what: "A full-stack operating platform for premium interior materials. Brings specialist kitchen and wardrobe businesses onto one shared tech, distribution and supply backbone for designers and studios.",
    meta: ["Bengaluru", "$15M, 3one4 Capital + Info Edge (Sep 2026)", "EBITDA positive from day one"],
    founders: [
      {
        name: "Saurabh Jain", title: "Co-founder",
        points: ["IIT Delhi, ISB", "Co-founder & India CEO of Livspace, scaled it to ~₹1,500 Cr run rate", "Sold his first startup, DezignUp, to Livspace"]
      },
      {
        name: "Lalit Mittal", title: "Co-founder",
        points: ["IIT Delhi", "Livspace CBO India, led the 30-city expansion", "Ex-Meesho; co-founded Labstreet (acquired)"]
      }
    ],
    contact: "No public email. LinkedIn the founders."
  },
  {
    company: "Indecimal",
    url: "https://www.indecimal.com",
    role: "Founder's Office, Growth (18–20 LPA)",
    what: "Builds homes end to end in Bengaluru with tech: fixed pricing, tracked progress, no contractor runaround. The role exists to take them to a second city.",
    meta: ["Bengaluru", "Founded Jun 2025", "~85 projects delivered"],
    founders: [
      {
        name: "Abhijit Sarkar", title: "Co-founder & CEO",
        points: ["B.Tech, MBA from JAGSoM", "Ex-Nestaway, Puravankara, makeO"]
      },
      {
        name: "Utkarsh Mishra", title: "Co-founder, Growth & Product",
        linkedin: "https://www.linkedin.com/in/utkarsh-mishra--/",
        points: ["BIT Mesra", "Ran the E-Cell there, 150+ members", "Says he hires for judgment, not skill"]
      },
      {
        name: "Pushker Prakash", title: "Co-founder & Tech Lead",
        points: ["BIT Mesra", "Ex-TenderFix, TrueGradient"]
      }
    ],
    contact: "LinkedIn Utkarsh, he owns the role."
  }
];

/* ---------- entries ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dot = `<i>&middot;</i>`;
const pad = n => String(n).padStart(2, "0");
const isEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
document.getElementById("entries").innerHTML = ROLES.map((r, i) => `
  <li class="entry">
    <div class="n">${pad(i + 1)}</div>
    <div>
      <div class="head">
        <h2><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.company)}</a></h2>
        <span class="role">${esc(r.role)}</span>
      </div>
      <p class="what">${esc(r.what)}</p>
      <p class="meta">${r.meta.map(esc).join(dot)}</p>
      <div class="founders">
        <h3>Founders</h3>
        ${r.founders.map(f => `
          <div class="founder">
            <div class="who">${f.linkedin ? `<a href="${esc(f.linkedin)}" target="_blank" rel="noopener">${esc(f.name)}</a>` : esc(f.name)}<span>, ${esc(f.title)}</span></div>
            <div class="pts">${f.points.map(esc).join(dot)}</div>
          </div>`).join("")}
      </div>
      ${r.contact ? `<p class="contact">${isEmail(r.contact) ? `<a href="mailto:${esc(r.contact)}">${esc(r.contact)}</a>` : esc(r.contact)}</p>` : ""}
    </div>
  </li>`).join("");
document.getElementById("count").textContent = `${ROLES.length} companies`;
document.getElementById("updated").textContent = UPDATED;
document.getElementById("updated2").textContent = UPDATED;

/* ---------- the run ---------- */
const stage = document.getElementById("stage");
const runner = document.getElementById("runner");
const hurray = document.getElementById("hurray");
const scoreEl = document.getElementById("score");
const START = 0.03, END = 0.95;           // the number line runs from 3% to 95% of the stage
const RUNNER_W = 44, SWORD_REACH = 44;    // photo width; how far the blade reaches ahead when swung
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

let W = stage.clientWidth;
let bubbles = [];
let cracked = 0;

function build() {
  stage.querySelectorAll(".tick, .bubble, .label, .finish, .burst, .cracked, .confetti").forEach(n => n.remove());
  W = stage.clientWidth;
  const n = ROLES.length;
  const addTick = (x, text) => {
    const t = document.createElement("div");
    t.className = "tick"; t.style.left = x + "px";
    t.innerHTML = `<b>${text}</b>`;
    stage.appendChild(t);
  };
  addTick(START * W, "0");
  bubbles = ROLES.map((r, i) => {
    const x = (START + (END - START) * ((i + 1) / (n + 1))) * W;
    addTick(x, String(i + 1));
    const b = document.createElement("div");
    b.className = "bubble"; b.style.left = x + "px";
    const l = document.createElement("div");
    l.className = "label"; l.style.left = x + "px"; l.textContent = r.company;
    stage.append(b, l);
    return { el: b, label: l, x, name: r.company, popped: false };
  });
  const f = document.createElement("div");
  f.className = "finish"; f.style.left = END * W + "px";
  f.innerHTML = `<svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#161616" stroke-width="1" stroke-linejoin="round"><path d="M0.5 0.5 L14 6 L0.5 11.5 Z"/></svg><small>finish</small>`;
  stage.appendChild(f);
  updateScore();
}

function updateScore() {
  scoreEl.textContent = `${cracked} of ${bubbles.length} cracked`;
}

function pop(b) {
  b.popped = true;
  runner.classList.remove("slash"); void runner.offsetWidth; runner.classList.add("slash");
  setTimeout(() => {
    b.el.classList.add("popped");
    b.label.classList.add("popped");
    const cy = 45 + 20;                                   // bubble centre, from the stage bottom
    for (let i = 0; i < 8; i++) {
      const p = document.createElement("span");
      p.className = "burst";
      p.style.left = b.x + "px"; p.style.bottom = cy + "px";
      p.style.setProperty("--a", (i * 45) + "deg");
      stage.appendChild(p);
      setTimeout(() => p.remove(), 520);
    }
    const c = document.createElement("div");
    c.className = "cracked"; c.style.left = b.x + "px";
    c.innerHTML = `<em>Cracked</em><span>${esc(b.name)}</span>`;
    stage.appendChild(c);
    setTimeout(() => c.remove(), 1120);
    cracked++; updateScore();
  }, 90);
  setTimeout(() => runner.classList.remove("slash"), 340);
}

/* confetti is moved from the same loop as the runner, so it advances under ?test too */
let confetti = [];
const CONFETTI_LIFE = 2.6;                // seconds a piece stays on screen
function celebrate() {
  hurray.classList.add("show");
  const colors = ["#161616", "#b3412a", "#a3a29b"];
  for (let i = 0; i < 28; i++) {
    const el = document.createElement("span");
    el.className = "confetti";
    el.style.background = colors[i % colors.length];
    stage.appendChild(el);
    confetti.push({
      el, t: 0,
      x: W * (0.2 + Math.random() * 0.6), y: -12 - Math.random() * 50,
      vx: (Math.random() - .5) * 30, vy: 60 + Math.random() * 50,
      r: Math.random() * 360, vr: (Math.random() - .5) * 400
    });
  }
}
function stepConfetti(dt) {
  confetti = confetti.filter(c => {
    c.t += dt; c.x += c.vx * dt; c.y += c.vy * dt; c.r += c.vr * dt;
    if (c.t > CONFETTI_LIFE) { c.el.remove(); return false; }
    c.el.style.transform = `translate(${c.x}px, ${c.y}px) rotate(${c.r}deg)`;
    c.el.style.opacity = Math.max(0, 1 - c.t / CONFETTI_LIFE);
    return true;
  });
}
function clearConfetti() { confetti.forEach(c => c.el.remove()); confetti = []; }

let x = 0, last = performance.now(), state = "run", waitUntil = 0;

function reset() {
  x = -RUNNER_W; cracked = 0;
  clearConfetti();
  bubbles.forEach(b => { b.popped = false; b.el.classList.remove("popped"); b.label.classList.remove("popped"); });
  hurray.classList.remove("show");
  runner.classList.remove("stop");
  updateScore();
  state = "run";
}

function frame(now) {
  const dt = Math.min(50, now - last) / 1000; last = now;
  const speed = Math.max(72, W / 7);       // px per second, crosses the stage in ~7s (slower floor on phones)
  if (state === "run") {
    x += speed * dt;
    const swordTip = x + RUNNER_W + SWORD_REACH;
    for (const b of bubbles) if (!b.popped && swordTip >= b.x) pop(b);
    if (x + RUNNER_W + 14 >= END * W) {       // stop just short of the finish line
      state = "party"; runner.classList.add("stop"); celebrate(); waitUntil = now + 2800;
    }
  } else if (state === "party") {
    stepConfetti(dt);
    if (now > waitUntil) reset();
  }
  runner.style.transform = `translateX(${x}px)`;
  tick(frame);
}
// ?test drives the loop with timers so headless screenshots advance
const tick = location.search.includes("test") ? f => setTimeout(() => f(performance.now()), 16) : requestAnimationFrame.bind(window);

build();
if (reduced) {
  x = START * W; runner.style.transform = `translateX(${x}px)`; runner.classList.add("stop");
} else {
  x = -RUNNER_W; tick(frame);
}
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { build(); reset(); }, 150); });
</script>
</body>
</html>
